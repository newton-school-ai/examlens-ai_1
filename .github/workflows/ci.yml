name: CI

on:
  push:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: examlens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/examlens_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Fallback install for dev tools in case they aren't in requirements.txt
          pip install black==24.3.0 isort flake8 pytest

      - name: Check formatting with black
        run: black --check .

      - name: Check import sorting with isort
        run: isort . --check-only

      - name: Lint with flake8
        run: flake8 .

      - name: Verify repository importability
        run: python -c "from src.agents import supervisor"

      - name: Verify PostgreSQL migrations
        run: alembic upgrade head

      - name: Run tests with pytest
        run: pytest
